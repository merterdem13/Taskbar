[package]
name = "bar"
version = "0.1.0"
edition = "2024"

[features]
default = ["render-skia"]
render-d2d = []
render-skia = ["dep:tiny-skia", "dep:fontdue"]

[dependencies]
core = { path = "../core" }
fontdue = { version = "0.9", optional = true }
tiny-skia = { version = "0.11", optional = true }
toml = "0.8"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_UI_HiDpi", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_UI_Controls", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }
